<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collaborative Workspace - Meetings</title></head>
<body data-page="meetings">
  <main><h1>Meetings</h1><nav><a href="/dashboard">Dashboard</a> | <a href="/messages">Messages</a></nav><p>Schedule project meetings.</p>
    <form id="meetingForm"><p><label>Meeting title<br><input name="title" required></label></p><p><label>Project ID<br><input name="project"></label></p>
      <p><label>Workspace ID<br><input name="workspace" required></label></p><p><label>Scheduled time<br><input name="scheduledAt" type="datetime-local" required></label></p>
      <p><label>Agenda<br><textarea name="agenda"></textarea></label></p><button type="submit">Schedule meeting</button>
    </form><p id="message" aria-live="polite"></p><pre id="data"></pre>
  </main><script src="/js/page-app.js" defer></script>
</body>
</html>
