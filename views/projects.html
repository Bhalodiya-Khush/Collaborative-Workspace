<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collaborative Workspace - Projects</title></head>
<body data-page="projects">
  <main>
    <h1>Projects</h1>
    <nav><a href="/dashboard">Dashboard</a> | <a href="/workspaces">Workspaces</a> | <a href="/tasks">Tasks</a> | <a href="/monitoring">Monitoring</a> | <a href="/reports">Reports</a></nav>
    <p>Create projects, update project progress, and change project status.</p>
    <h2>Create project</h2>
    <form id="projectForm">
      <p><label>Project name<br><input name="name" required></label></p><p><label>Description<br><input name="description"></label></p>
      <p><label>Workspace ID<br><input name="workspace" required></label></p><p><label>Project manager ID<br><input name="projectManager" required></label></p>
      <p><label>Developer IDs separated by commas<br><input name="developers"></label></p><button type="submit">Create project</button>
    </form>
    <h2>Update project</h2>
    <form id="projectUpdateForm">
      <p><label>Project ID<br><input name="projectId" required></label></p><p><label>New name<br><input name="name"></label></p>
      <p><label>Status<br><input name="status"></label></p><p><label>Progress 0-100<br><input name="progress" type="number" min="0" max="100"></label></p>
      <button type="submit">Update project</button>
    </form>
    <p id="message" aria-live="polite"></p><pre id="data"></pre>
  </main>
  <script src="/js/page-app.js" defer></script>
</body>
</html>
