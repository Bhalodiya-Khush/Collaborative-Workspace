<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collaborative Workspace - Messages</title></head>
<body data-page="messages">
  <main><h1>Messages</h1><nav><a href="/dashboard">Dashboard</a> | <a href="/meetings">Meetings</a></nav><p>Send messages to a workspace or project.</p>
    <form id="messageForm"><p><label>Workspace ID<br><input name="workspace" required></label></p><p><label>Project ID<br><input name="project"></label></p>
      <p><label>Receiver user ID<br><input name="receiver"></label></p><p><label>Message<br><textarea name="content" required></textarea></label></p><button type="submit">Send message</button>
    </form><p id="message" aria-live="polite"></p><pre id="data"></pre>
  </main><script src="/js/page-app.js" defer></script>
</body>
</html>
