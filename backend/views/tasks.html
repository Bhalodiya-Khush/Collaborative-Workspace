<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collaborative Workspace - Tasks</title></head>
<body data-page="tasks">
  <main><h1>Tasks</h1><nav><a href="/dashboard">Dashboard</a> | <a href="/projects">Projects</a> | <a href="/submissions">Submissions</a></nav>
    <p>Create, assign, filter, and update project tasks.</p>
    <h2>Create task</h2>
    <form id="taskForm">
      <p><label>Task title<br><input name="title" required></label></p><p><label>Description<br><input name="description"></label></p>
      <p><label>Project ID<br><input name="project" required></label></p><p><label>Workspace ID<br><input name="workspace" required></label></p>
      <p><label>Developer ID<br><input name="assignee"></label></p><p><label>Due date<br><input name="dueDate" type="date"></label></p>
      <button type="submit">Create task</button>
    </form>
    <h2>Update task</h2>
    <form id="taskUpdateForm"><p><label>Task ID<br><input name="taskId" required></label></p>
      <p><label>Status<br><select name="status"><option value="">Keep current status</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="in_review">In review</option><option value="completed">Completed</option><option value="blocked">Blocked</option></select></label></p>
      <p><label>Progress 0-100<br><input name="completionPercentage" type="number" min="0" max="100"></label></p><button type="submit">Update task</button>
    </form>
    <h2>Assign task</h2>
    <form id="taskAssignForm"><p><label>Task ID<br><input name="taskId" required></label></p><p><label>Developer ID<br><input name="assignee" required></label></p><button type="submit">Assign task</button></form>
    <p id="message" aria-live="polite"></p><pre id="data"></pre>
  </main><script src="/js/page-app.js" defer></script>
</body>
</html>
