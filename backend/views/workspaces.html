<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collaborative Workspace - Workspaces</title></head>
<body data-page="workspaces">
  <main>
    <h1>Workspaces</h1>
    <nav><a href="/dashboard">Dashboard</a> | <a href="/users">Users</a> | <a href="/projects">Projects</a> | <a href="/tasks">Tasks</a></nav>
    <p>Create and view company workspaces.</p>
    <h2>Create workspace</h2>
    <form id="workspaceForm">
      <p><label>Workspace name<br><input name="name" required></label></p><p><label>Description<br><input name="description"></label></p>
      <p><label>Owner user ID<br><input name="owner" required></label></p><p><label>Member IDs separated by commas<br><input name="members"></label></p>
      <button type="submit">Create workspace</button>
    </form>
    <h2>Add workspace member</h2>
    <form id="memberForm"><p><label>Workspace ID<br><input name="workspaceId" required></label></p><p><label>User ID<br><input name="userId" required></label></p><button type="submit">Add member</button></form>
    <h2>Assign workspace role</h2>
    <form id="roleForm"><p><label>Workspace ID<br><input name="workspaceId" required></label></p><p><label>User ID<br><input name="userId" required></label></p><p><label>Role<br><input name="role" required></label></p><button type="submit">Assign role</button></form>
    <h2>Workspace activity</h2>
    <form id="activityForm"><p><label>Workspace ID<br><input name="workspaceId" required></label></p><button type="submit">Load activity</button></form>
    <p id="message" aria-live="polite"></p><pre id="data"></pre>
  </main>
  <script src="/js/page-app.js" defer></script>
</body>
</html>
