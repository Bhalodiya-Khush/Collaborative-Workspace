<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collaborative Workspace - Notifications</title></head>

  <main><h1>Notifications</h1><nav><a href="/dashboard">Dashboard</a> | <a href="/tasks">Tasks</a> | <a href="/submissions">Submissions</a></nav>
