<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collaborative Workspace - Submissions</title></head>
<body data-page="submissions">
  <main><h1>Code Submissions</h1><nav><a href="/dashboard">Dashboard</a> | <a href="/tasks">Tasks</a> | <a href="/projects">Projects</a></nav>
    <p>Upload source files or ZIP files and review submissions.</p>
    <h2>Upload submission</h2>
    <form id="submissionForm">
      <p><label>Project ID<br><input name="project" required></label></p><p><label>Task ID<br><input name="task" required></label></p>
      <p><label>Submission title<br><input name="title" required></label></p><p><label>Description<br><textarea name="description"></textarea></label></p>
      <p><label>Branch name<br><input name="branchName"></label></p><p><label>Files<br><input type="file" name="files" multiple></label></p>
      <button type="submit">Upload submission</button>
    </form>
    <h2>Review submission</h2>
    <form id="submissionReviewForm">
      <p><label>Submission ID<br><input name="submissionId" required></label></p>
      <p><label>Review status<br><select name="reviewStatus"><option value="approved">Approved</option><option value="changes_requested">Changes requested</option></select></label></p>
      <p><label>Review notes<br><textarea name="reviewNotes"></textarea></label></p><button type="submit">Review submission</button>
    </form>
    <p id="message" aria-live="polite"></p><pre id="data"></pre>
  </main><script src="/js/page-app.js" defer></script>
</body>
</html>
